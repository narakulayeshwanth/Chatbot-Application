<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lavangam.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-modal-content">
            <h2>Welcome to lavangam.ai</h2>
            <p>Please log in to continue</p>
            
            <button id="googleLoginBtn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                Continue with Google
            </button>
            
            <div class="divider"><span>OR</span></div>
            
            <form id="emailAuthForm">
                <input type="email" id="authEmail" placeholder="Email address" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <button type="submit" id="emailLoginBtn" class="primary-btn">Sign In / Register</button>
            </form>
            <p id="authError" class="auth-error hidden"></p>
        </div>
    </div>

    <div class="app-layout" id="appLayout" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="icon"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 4C12.5523 4 13 4.44772 13 5V11H19C19.5523 11 20 11.4477 20 12C20 12.5523 19.5523 13 19 13H13V19C13 19.5523 12.5523 20 12 20C11.4477 20 11 19.5523 11 19V13H5C4.44772 13 4 12.5523 4 12C4 11.4477 4.44772 11 5 11H11V5C11 4.44772 11.4477 4 12 4Z" fill="currentColor"></path></svg>
                New Chat
            </button>
            <div class="history-list">
                <p class="history-title">Today</p>
                <div class="history-item active">Current Conversation</div>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggleBtn" class="new-chat-btn" style="margin-bottom: 12px; width: 100%;">
                    <span id="themeIcon" style="display: flex; align-items: center; justify-content: center; width: 16px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                    <span id="themeText">Dark Mode</span>
                </button>
                <div class="user-profile">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userName">User</span>
                </div>
                <button id="logoutBtn" class="new-chat-btn" style="margin-top: 8px; width: 100%; justify-content: center; color: #ef4444;">
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="chat-header">
                <h2>lavangam.ai <span class="version-tag">4o</span></h2>
            </header>

            <div id="chatbox" class="chatbox"></div>
            
            <div id="loader" class="loader hidden">
                <div class="doting">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-container">
                <div id="filePreview" class="file-preview hidden"></div>
                <div class="input-wrapper">
                    <input type="file" id="fileUpload" style="display:none;" accept=".pdf,.txt,.csv,.png,.jpg,.jpeg">
                    <button id="uploadBtn" class="tool-btn" title="Upload File or Image">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    
                    <textarea id="userInput" placeholder="Message lavangam.ai..." rows="1"></textarea>
                    
                    <button id="sendBtn" class="send-btn" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                </div>
                <div class="footer-text">
                    lavangam.ai can make mistakes. Consider verifying important information.
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="{{ url_for('static', filename='script.js') }}?v=6"></script>
</body>
</html>
